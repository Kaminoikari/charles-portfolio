name: CI

# The checks that need nothing but the checkout: lint, types, and both test
# suites. They all ran locally before every commit and none of them ran here,
# which is the gap this closes: a test only stops a regression if something runs
# it without being asked.
#
# No secrets. Every suite is offline by construction: the rag tests stub their
# suppliers, and the avatar tests read VRM fixtures out of public/avatar. The
# eval, which does need Voyage and Qdrant, stays in its own workflow.
#
# Offline does not mean Node-only: one avatar test shells out to python3, which
# is why the toolchain below is set up before the suites run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch supersedes an in-flight run: only the tip
# matters, and the avatar fixtures make each run a ~110MB checkout.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # scripts/avatar/springsim.test.ts builds a VRM 1.0 twin of its fixture by
      # shelling out to python3, and that path imports glb.py, which needs numpy.
      # The runner ships python3 and no packages, so without this the test fails
      # on ModuleNotFoundError while every other suite passes.
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install numpy

      - run: npm ci

      - name: Lint
        run: npm run lint

      # `tsc -b` is the real type gate and it covers the test files too. Running
      # it through `npm run build` also proves the bundle still builds, which is
      # what Vercel will do on deploy anyway.
      - name: Types and build
        run: npm run build

      # Ordered cheapest-first so a broken pipeline fails in ~10s rather than
      # after the avatar suites finish replaying motion clips frame by frame.
      - name: RAG tests
        run: npm run rag:test

      # Gated on the reported result, not on the exit code. `npm test` exits 1 on
      # a run where all 1,636 tests pass, because a worker misses vitest's birpc
      # "onTaskUpdate" heartbeat during the avatar suites' long synchronous CPU
      # sweeps. Measured on 2026-09-16: 3/3 runs at the configured 2 threads, and
      # once each at --pool=forks and --maxWorkers=1, all exit 1 with all tests
      # passing and exactly one such error. vitest exposes no knob for the birpc
      # timeout, so there is nothing to configure around it.
      #
      # A step that is red by construction teaches everyone to ignore CI, and
      # dropping the step would lose the coverage, so the summary line decides:
      # vitest prints "Tests  N failed | M passed" when anything actually fails,
      # and the line is absent entirely if the run never got that far. Both are
      # failures here.
      #
      # The summary is stripped of ANSI first. vitest colours it even writing to
      # a pipe under CI, and the codes land BETWEEN the label and the count
      # ("\e[2m  Tests \e[22m \e[1m\e[32m1636 passed"), so a pattern written
      # against a plain local run matches nothing here — the gate then reports
      # "no result line" and fails every run, green ones included. That is how
      # this shipped broken: the discriminator was validated against macOS
      # output, where nothing colours a redirect.
      - name: Frontend and tooling tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log || echo "::warning::vitest exited non-zero; judging by the reported result"
          sed -E $'s/\x1b\\[[0-9;]*m//g' vitest.log > vitest.plain
          if ! grep -qE '^ *Tests +[0-9]+ passed \(' vitest.plain || grep -qE '^ *Tests .*failed' vitest.plain; then
            echo "::error::vitest reported failures, or did not report a result at all"
            exit 1
          fi
          echo "vitest reported every test passing"
