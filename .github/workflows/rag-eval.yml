name: RAG Eval

# Manually triggered eval against the live Qdrant index. Runs the golden set
# through the retrieval arms (sparse-only → dense-only → hybrid → hybrid+rerank) for
# recall@k / MRR / Δrecall, plus the corrective arm: the full graph that
# generates an answer and scores it with the faithfulness judge. Results print
# to the job log.
#
# Why a workflow and not a local run: eval needs outbound access to Voyage,
# Qdrant, Anthropic and Gemini plus the secrets below. This runner has them; a
# local checkout does not, because the Vercel-side keys are Encrypted and cannot
# be pulled back to a developer machine.
#
# Required repo secrets:
#   QDRANT_URL · QDRANT_API_KEY · VOYAGE_API_KEY   → retrieval arms
#   ANTHROPIC_API_KEY · GEMINI_API_KEY             → corrective arm + faithfulness judge
# With the last two absent, the corrective arm self-skips and only the retrieval
# arms run (run-eval.ts drops it when ANTHROPIC_API_KEY is unset).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/ref to check out and run (defaults to main)'
        type: string
        default: main
      collection:
        description: 'Qdrant collection to evaluate (defaults to the production doc_chunks)'
        type: string
        default: doc_chunks
      arm:
        description: 'Single arm to run (blank = all arms). e.g. corrective'
        type: string
        default: ''
      locale:
        description: 'Single locale to run (blank = all: en, zh-TW, ja). e.g. en'
        type: string
        default: ''
      retrieval_only:
        description: 'Run only the deterministic retrieval arms (skip the corrective/LLM arm)'
        type: boolean
        default: false
      faq_sparse_veto:
        description: 'Ask BM25 for a second opinion before serving a FAQ cache hit (RAG_FAQ_SPARSE_VETO)'
        type: boolean
        # Production runs with the veto on (rag/config.ts), so that is what an
        # eval measures unless asked otherwise. It defaulted to off here, which
        # made every default run score a FAQ tier nobody is served.
        default: true
      write_baseline:
        description: 'Write the per-question recall baseline the post-ingest gate compares against (needs a single arm, e.g. hybrid+rerank)'
        type: boolean
        default: false
      faq_calibration:
        description: 'Instead of the golden set, sweep the FAQ cache threshold x margin by leave-one-out (rag/evals/faq-calibration.ts)'
        type: boolean
        default: false

# Eval only reads the checkout and calls external APIs — no repo write needed.
# Pin the token to read so it stays minimal regardless of the org-level default.
permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Calibrates what THIS ref would ship, not what production currently holds:
      # the ref's FAQ entries are built into a scratch collection first
      # (incremental, so a re-run embeds only what changed), and the sweep and the
      # judge run against that. The production faq_cache is never written.
      - name: FAQ cache calibration
        if: ${{ inputs.faq_calibration }}
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QDRANT_FAQ_COLLECTION: faq_cache_calibration
          # A scratch copy has nothing to protect, and a capped prune leaves the
          # previous revision's entries in it (the calibration then refuses to run).
          RAG_PRUNE: '1'
        run: |
          npm run rag:faq
          npm run rag:faq:calibrate -- --out faq-calibration.md --dump faq-observations.json --judge --verdicts faq-verdicts.json
          cat faq-calibration.md >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the calibration observations
        if: ${{ inputs.faq_calibration }}
        uses: actions/upload-artifact@v4
        with:
          name: faq-calibration
          path: |
            faq-calibration.md
            faq-observations.json
            faq-verdicts.json

      - name: Run eval (retrieval arms + corrective / faithfulness)
        if: ${{ !inputs.faq_calibration }}
        env:
          QDRANT_URL: ${{ secrets.QDRANT_URL }}
          QDRANT_API_KEY: ${{ secrets.QDRANT_API_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Run grade/rewrite/generate on Claude so the suite is never throttled
          # by Gemini's free-tier 5-req/min quota. EVAL-ONLY; production keeps the
          # Gemini-first cost cascade (this flag stays unset there).
          RAG_FORCE_CLAUDE: '1'
          # Measured before it ships: this is the switch the corrective arm runs
          # the FAQ cache under, so one run with it on and one with it off are
          # directly comparable.
          RAG_FAQ_SPARSE_VETO: ${{ inputs.faq_sparse_veto && '1' || '0' }}
          QDRANT_COLLECTION: ${{ inputs.collection || 'doc_chunks' }}
          # Inputs passed via env (not interpolated into the script) to avoid
          # shell injection from workflow_dispatch fields.
          ARM: ${{ inputs.arm }}
          LOCALE: ${{ inputs.locale }}
          RETRIEVAL_ONLY: ${{ inputs.retrieval_only }}
          WRITE_BASELINE: ${{ inputs.write_baseline }}
        run: |
          ARGS="--out eval-report.md"
          [ -n "$ARM" ] && ARGS="$ARGS --arm $ARM"
          [ -n "$LOCALE" ] && ARGS="$ARGS --locale $LOCALE"
          [ "$RETRIEVAL_ONLY" = "true" ] && ARGS="$ARGS --retrieval-only"
          [ "$WRITE_BASELINE" = "true" ] && ARGS="$ARGS --write-baseline eval-baseline.json"
          echo "running: npm run rag:eval -- $ARGS"
          npm run rag:eval -- $ARGS
          # Surface the ablation table in the run summary (and echo which collection).
          {
            echo "### RAG Eval — collection \`${QDRANT_COLLECTION}\`"
            echo ""
            cat eval-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the baseline
        if: ${{ inputs.write_baseline && !inputs.faq_calibration }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-baseline
          path: eval-baseline.json
