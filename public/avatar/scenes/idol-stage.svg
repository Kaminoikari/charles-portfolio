<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <!-- Original placeholder for the /avatar stage (2026-09-29): a concert stage with an LED wall. -->
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060f"/>
      <stop offset="1" stop-color="#140a2a"/>
    </linearGradient>
    <linearGradient id="led" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00d9ff"/>
      <stop offset="0.5" stop-color="#7b5cff"/>
      <stop offset="1" stop-color="#ff5fb8"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5fb8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5fb8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1236"/>
      <stop offset="1" stop-color="#07050f"/>
    </linearGradient>
    <radialGradient id="spot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.2" fill="#ffffff" opacity="0.18"/>
    </pattern>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#back)"/>

  <!-- truss -->
  <g stroke="#2e2a44" stroke-width="6" fill="none">
    <line x1="0" y1="70" x2="1920" y2="70"/><line x1="0" y1="110" x2="1920" y2="110"/>
  </g>
  <g stroke="#2e2a44" stroke-width="3">
    <path d="M0 70 L40 110 L80 70 L120 110 L160 70 L200 110 L240 70 L280 110 L320 70 L360 110 L400 70 L440 110 L480 70 L520 110 L560 70 L600 110 L640 70 L680 110 L720 70 L760 110 L800 70 L840 110 L880 70 L920 110 L960 70 L1000 110 L1040 70 L1080 110 L1120 70 L1160 110 L1200 70 L1240 110 L1280 70 L1320 110 L1360 70 L1400 110 L1440 70 L1480 110 L1520 70 L1560 110 L1600 70 L1640 110 L1680 70 L1720 110 L1760 70 L1800 110 L1840 70 L1880 110 L1920 70" fill="none"/>
  </g>

  <!-- LED wall -->
  <g>
    <rect x="360" y="170" width="1200" height="520" rx="8" fill="url(#led)" opacity="0.9"/>
    <rect x="360" y="170" width="1200" height="520" rx="8" fill="url(#dots)"/>
    <g fill="none" stroke="#ffffff" stroke-width="6" opacity="0.55">
      <path d="M960 280 L990 360 L1075 360 L1006 410 L1032 492 L960 442 L888 492 L914 410 L845 360 L930 360 Z"/>
    </g>
    <g stroke="#ffffff" opacity="0.25" stroke-width="2">
      <line x1="360" y1="300" x2="1560" y2="300"/><line x1="360" y1="430" x2="1560" y2="430"/><line x1="360" y1="560" x2="1560" y2="560"/>
      <line x1="660" y1="170" x2="660" y2="690"/><line x1="960" y1="170" x2="960" y2="690"/><line x1="1260" y1="170" x2="1260" y2="690"/>
    </g>
    <rect x="340" y="150" width="1240" height="560" rx="16" fill="none" stroke="#1d1a33" stroke-width="16"/>
  </g>

  <!-- side screens -->
  <rect x="60" y="230" width="220" height="400" rx="6" fill="#00d9ff" opacity="0.25"/>
  <rect x="1640" y="230" width="220" height="400" rx="6" fill="#ff5fb8" opacity="0.25"/>

  <!-- beams -->
  <g filter="url(#blur)">
    <path d="M220 90 L60 900 L420 900 Z" fill="url(#beamC)"/>
    <path d="M1700 90 L1500 900 L1860 900 Z" fill="url(#beamP)"/>
    <path d="M700 90 L520 900 L820 900 Z" fill="url(#beam)" opacity="0.6"/>
    <path d="M1220 90 L1100 900 L1400 900 Z" fill="url(#beam)" opacity="0.6"/>
  </g>
  <g fill="#e9f7ff">
    <circle cx="220" cy="92" r="12"/><circle cx="700" cy="92" r="12"/><circle cx="1220" cy="92" r="12"/><circle cx="1700" cy="92" r="12"/>
  </g>

  <!-- stage floor -->
  <path d="M0 760 L1920 760 L1920 1080 L0 1080 Z" fill="url(#floor)"/>
  <rect y="752" width="1920" height="10" fill="#3a2d6b"/>
  <g opacity="0.5">
    <rect x="360" y="770" width="1200" height="120" fill="url(#led)" opacity="0.22" filter="url(#blur)"/>
  </g>
  <g stroke="#2a2150" stroke-width="2" opacity="0.8">
    <line x1="0" y1="840" x2="1920" y2="840"/><line x1="0" y1="940" x2="1920" y2="940"/>
    <line x1="960" y1="760" x2="960" y2="1080"/><line x1="560" y1="760" x2="300" y2="1080"/><line x1="1360" y1="760" x2="1620" y2="1080"/>
  </g>
  <!-- spotlight on the figure -->
  <ellipse cx="960" cy="965" rx="400" ry="80" fill="url(#spot)"/>
</svg>
