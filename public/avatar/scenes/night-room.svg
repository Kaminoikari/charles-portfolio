<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMax slice">
  <!-- Original placeholder for the /avatar stage (2026-09-29): a streamer's room at night. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1433"/>
      <stop offset="1" stop-color="#2a1f4a"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1030"/>
      <stop offset="0.7" stop-color="#27306b"/>
      <stop offset="1" stop-color="#6b4a8c"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a4a"/>
      <stop offset="1" stop-color="#1a1224"/>
    </linearGradient>
    <radialGradient id="neon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff7ad9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff7ad9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd59a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rug" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a5cc4"/>
      <stop offset="1" stop-color="#4b3589"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#wall)"/>
  <!-- wall panelling -->
  <g stroke="#34295a" stroke-width="3" opacity="0.6">
    <line x1="0" y1="690" x2="1920" y2="690"/>
    <line x1="0" y1="700" x2="1920" y2="700"/>
  </g>

  <!-- window -->
  <g transform="translate(560 150)">
    <rect x="-18" y="-18" width="836" height="536" rx="10" fill="#120d24"/>
    <rect width="800" height="500" fill="url(#sky)"/>
    <circle cx="640" cy="110" r="46" fill="#fff4cf"/>
    <circle cx="640" cy="110" r="90" fill="#fff4cf" opacity="0.12"/>
    <g fill="#ffffff" opacity="0.8">
      <circle cx="80" cy="60" r="2"/><circle cx="210" cy="120" r="1.6"/><circle cx="330" cy="40" r="2.2"/>
      <circle cx="470" cy="90" r="1.5"/><circle cx="540" cy="30" r="1.8"/><circle cx="740" cy="200" r="1.6"/>
      <circle cx="150" cy="190" r="1.4"/><circle cx="400" cy="170" r="1.8"/>
    </g>
    <!-- skyline -->
    <g fill="#151a3a">
      <rect x="0" y="300" width="90" height="200"/><rect x="90" y="250" width="70" height="250"/>
      <rect x="160" y="320" width="110" height="180"/><rect x="270" y="210" width="80" height="290"/>
      <rect x="350" y="290" width="120" height="210"/><rect x="470" y="240" width="70" height="260"/>
      <rect x="540" y="330" width="130" height="170"/><rect x="670" y="270" width="130" height="230"/>
    </g>
    <g fill="#ffd27a" opacity="0.85">
      <rect x="20" y="330" width="10" height="14"/><rect x="50" y="370" width="10" height="14"/><rect x="110" y="280" width="10" height="14"/>
      <rect x="130" y="330" width="10" height="14"/><rect x="190" y="350" width="10" height="14"/><rect x="230" y="390" width="10" height="14"/>
      <rect x="290" y="240" width="10" height="14"/><rect x="320" y="300" width="10" height="14"/><rect x="380" y="320" width="10" height="14"/>
      <rect x="420" y="360" width="10" height="14"/><rect x="490" y="270" width="10" height="14"/><rect x="510" y="330" width="10" height="14"/>
      <rect x="570" y="360" width="10" height="14"/><rect x="620" y="400" width="10" height="14"/><rect x="700" y="300" width="10" height="14"/>
      <rect x="750" y="350" width="10" height="14"/><rect x="730" y="420" width="10" height="14"/>
    </g>
    <!-- frame -->
    <g fill="#120d24">
      <rect x="395" y="0" width="12" height="500"/>
      <rect x="0" y="245" width="800" height="10"/>
    </g>
    <!-- curtains -->
    <path d="M-60 -30 C 0 150 -20 380 30 540 L -90 540 L -90 -30 Z" fill="#5d3f9a"/>
    <path d="M860 -30 C 800 150 820 380 770 540 L 890 540 L 890 -30 Z" fill="#5d3f9a"/>
    <path d="M-20 -30 C 30 160 10 380 50 540" stroke="#7a57c2" stroke-width="6" fill="none" opacity="0.6"/>
    <path d="M820 -30 C 770 160 790 380 750 540" stroke="#7a57c2" stroke-width="6" fill="none" opacity="0.6"/>
  </g>

  <!-- fairy lights -->
  <path d="M120 120 Q 560 230 960 110 T 1800 120" stroke="#3b2f5e" stroke-width="3" fill="none"/>
  <g fill="#ffe08a">
    <circle cx="200" cy="140" r="7"/><circle cx="330" cy="168" r="7"/><circle cx="460" cy="186" r="7"/>
    <circle cx="590" cy="190" r="7"/><circle cx="720" cy="176" r="7"/><circle cx="850" cy="146" r="7"/>
    <circle cx="1070" cy="118" r="7"/><circle cx="1200" cy="126" r="7"/><circle cx="1330" cy="142" r="7"/>
    <circle cx="1460" cy="146" r="7"/><circle cx="1590" cy="136" r="7"/><circle cx="1720" cy="122" r="7"/>
  </g>
  <g fill="#ffe08a" opacity="0.35" filter="url(#glow)">
    <circle cx="200" cy="140" r="16"/><circle cx="330" cy="168" r="16"/><circle cx="460" cy="186" r="16"/>
    <circle cx="590" cy="190" r="16"/><circle cx="720" cy="176" r="16"/><circle cx="850" cy="146" r="16"/>
    <circle cx="1070" cy="118" r="16"/><circle cx="1200" cy="126" r="16"/><circle cx="1330" cy="142" r="16"/>
    <circle cx="1460" cy="146" r="16"/><circle cx="1590" cy="136" r="16"/><circle cx="1720" cy="122" r="16"/>
  </g>

  <!-- neon heart sign -->
  <g transform="translate(1520 330)">
    <ellipse cx="0" cy="10" rx="190" ry="160" fill="url(#neon)"/>
    <path d="M0 70 C -120 -10 -90 -110 0 -50 C 90 -110 120 -10 0 70 Z" fill="none" stroke="#ff9be4" stroke-width="10" stroke-linejoin="round" filter="url(#soft)"/>
    <path d="M0 70 C -120 -10 -90 -110 0 -50 C 90 -110 120 -10 0 70 Z" fill="none" stroke="#fff0fb" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- shelf with plushies and books -->
  <g transform="translate(140 470)">
    <rect x="0" y="120" width="300" height="16" rx="4" fill="#4a3674"/>
    <rect x="20" y="40" width="26" height="80" fill="#e889b8"/><rect x="48" y="52" width="22" height="68" fill="#79c6e8"/>
    <rect x="72" y="46" width="24" height="74" fill="#f2d27a"/>
    <circle cx="170" cy="92" r="30" fill="#f4e6ff"/><circle cx="148" cy="66" r="12" fill="#f4e6ff"/><circle cx="192" cy="66" r="12" fill="#f4e6ff"/>
    <circle cx="160" cy="92" r="3.5" fill="#3a2a4a"/><circle cx="180" cy="92" r="3.5" fill="#3a2a4a"/>
    <circle cx="250" cy="98" r="22" fill="#ffc9a8"/><circle cx="236" cy="80" r="8" fill="#ffc9a8"/><circle cx="264" cy="80" r="8" fill="#ffc9a8"/>
  </g>

  <!-- desk lamp glow, right -->
  <ellipse cx="1760" cy="620" rx="160" ry="120" fill="url(#lamp)" opacity="0.5"/>

  <!-- floor -->
  <rect y="760" width="1920" height="320" fill="url(#floor)"/>
  <g stroke="#2b1f3a" stroke-width="3" opacity="0.7">
    <line x1="0" y1="820" x2="1920" y2="820"/><line x1="0" y1="900" x2="1920" y2="900"/><line x1="0" y1="1000" x2="1920" y2="1000"/>
  </g>
  <rect y="752" width="1920" height="12" fill="#23193a"/>
  <!-- rug under the figure -->
  <ellipse cx="960" cy="960" rx="470" ry="92" fill="url(#rug)" opacity="0.9"/>
  <ellipse cx="960" cy="960" rx="420" ry="74" fill="none" stroke="#b39cf0" stroke-width="4" opacity="0.5"/>
</svg>
